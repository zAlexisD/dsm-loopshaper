[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsm-loopshaper"
version = "0.1.0"
description = "A Python toolbox for Feedback filter optimization in Delta Sigma Modulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "joblib>=1.5.3",

    "cvxpy>=1.9.2",
    "MarkupSafe>=3.0.3",
    "cffi>=2.0.0",
    "clarabel>=0.11.1",
    "highspy>=1.15.1",
    "jinja2>=3.1.6",
    "osqp>=1.1.3",
    "pycparser>=3.0",
    "qdldl>=0.1.9.post1",
    "scs>=3.2.11",
    "sparsediffpy>=0.3.0",
    "cvxopt>=1.3.3",

    "matplotlib>=3.11.0",
    "contourpy>=1.3.3",
    "cycler>=0.12.1",
    "fonttools>=4.63.0",
    "kiwisolver>=1.5.0",
    "packaging>=26.2",
    "pillow>=12.3.0",
    "pyparsing>=3.3.2",
    "python-dateutil>=2.9.0.post0",
    "six>=1.17.0",

    "adjustText">=1.4.0,
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/zAlexisD/dsm-loopshaper"